name: Apply Supabase migrations

# Applies new supabase/migrations/*.sql to the dev project when they land on
# main (and lists what is pending on PRs). Uses the Management API with the
# SUPABASE_ACCESS_TOKEN secret; no database password needed.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', '.github/workflows/supabase-migrate.yml', '.github/scripts/apply-migrations.mjs']
  pull_request:
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency:
  group: supabase-migrate
  cancel-in-progress: false

env:
  PROJECT_REF: itugzzvugoohsiedfioi   # safetrack-cloud-dev (ca-central-1)

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pending migrations (PR) / apply (main)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node .github/scripts/apply-migrations.mjs --dry-run
          else
            node .github/scripts/apply-migrations.mjs
          fi
