name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Type-check Edge Functions under Deno
        run: |
          for fn in supabase/functions/*/; do
            name=$(basename "$fn"); [ "${name#_}" = "$name" ] || continue
            cfg=""; [ -f "$fn/deno.json" ] && cfg="--config $fn/deno.json"
            npx -y deno@2 check $cfg "$fn/index.ts"
          done
      - run: npm run build
      - name: Filenames must be valid on Windows
        run: |
          bad=$(git ls-files | grep -E '[<>:"|?*\\]|[ .]$|(^|/)(CON|PRN|AUX|NUL|COM[0-9]|LPT[0-9])(\.|/|$)' || true)
          if [ -n "$bad" ]; then echo "::error::Windows-invalid file names (breaks git clone on Windows):"; echo "$bad"; exit 1; fi
