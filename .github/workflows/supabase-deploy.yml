name: Deploy Supabase functions

# Deploys supabase/functions/* to the dev project whenever they change.
# Needs one repository secret: SUPABASE_ACCESS_TOKEN (a Supabase personal
# access token). Without it the job explains what to add and exits cleanly.
on:
  push:
    branches: [main, 'feat/**']
    paths: ['supabase/functions/**', '.github/workflows/supabase-deploy.yml']
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

env:
  PROJECT_REF: itugzzvugoohsiedfioi   # safetrack-cloud-dev (ca-central-1)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for access token
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set. Add it under Settings > Secrets and variables > Actions to enable deploys."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.token.outputs.present == 'true'
        with:
          version: 3.1.0   # pinned: CLI flags changed in v3; bump deliberately

      - name: Deploy functions
        if: steps.token.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for fn in $(ls -d supabase/functions/*/ | xargs -n1 basename | grep -v '^_'); do
            echo "Deploying $fn"
            # mailbox-poll is called by the scheduler (no user session); it authenticates every request itself
            extra=""; [ "$fn" = "mailbox-poll" ] && extra="--no-verify-jwt"
            supabase functions deploy "$fn" --remote="$PROJECT_REF" --use-api --yes $extra
          done

      - name: Smoke test (functions respond, reject anonymous calls)
        if: steps.token.outputs.present == 'true'
        run: |
          for fn in members insight mailbox-poll; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://$PROJECT_REF.supabase.co/functions/v1/$fn")
            echo "$fn -> HTTP $code (expect 401 without a session)"
            [ "$code" = "401" ] || { echo "::error::$fn did not reject an anonymous call"; exit 1; }
          done
