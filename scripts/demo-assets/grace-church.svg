<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="54 40 393 236">
  <rect x="0" y="0" width="500" height="300" fill="#ffffff"/>
  <!-- Arched window mark with cross and rising light -->
  <g transform="translate(250 112)">
    <path d="M-58 62 V-8 A58 58 0 0 1 58 -8 V62 Z" fill="#1f3a6e"/>
    <path d="M-44 62 V-6 A44 44 0 0 1 44 -6 V62 Z" fill="#2a4f91"/>
    <!-- light rays -->
    <g fill="#eab308" opacity="0.9">
      <path d="M0 40 L-40 62 L-30 62 Z"/>
      <path d="M0 40 L-14 62 L-6 62 Z"/>
      <path d="M0 40 L6 62 L14 62 Z"/>
      <path d="M0 40 L30 62 L40 62 Z"/>
    </g>
    <!-- cross -->
    <rect x="-5" y="-38" width="10" height="78" rx="2" fill="#f6d36b"/>
    <rect x="-24" y="-18" width="48" height="10" rx="2" fill="#f6d36b"/>
    <!-- base -->
    <rect x="-70" y="62" width="140" height="8" rx="4" fill="#1f3a6e"/>
  </g>
  <text x="250" y="228" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" fill="#1f3a6e" letter-spacing="1">Grace Community</text>
  <text x="250" y="264" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="22" fill="#b98a06" letter-spacing="9">CHURCH</text>
</svg>
